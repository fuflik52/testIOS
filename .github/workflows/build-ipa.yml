# Builds an unsigned Ritm.ipa on a GitHub macOS runner and publishes it as a release:
# https://github.com/<owner>/<repo>/releases/latest/download/Ritm.ipa
name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install xtool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xtool.zip" \
            https://github.com/xtool-org/xtool/releases/latest/download/xtool.app.zip
          ditto -x -k "$RUNNER_TEMP/xtool.zip" "$RUNNER_TEMP/xtool"
          echo "$RUNNER_TEMP/xtool/xtool.app/Contents/Resources/bin" >> "$GITHUB_PATH"

      - name: Build unsigned IPA
        run: |
          xtool --version || true
          xtool dev build --ipa --configuration release

      - uses: actions/upload-artifact@v4
        with:
          name: Ritm-ipa
          path: xtool/Ritm.ipa
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" xtool/Ritm.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Ритм — сборка ${{ github.run_number }}" \
            --notes "Неподписанный Ritm.ipa. Установка: Sideloadly / AltStore / SideStore (подпись вашим Apple ID)." \
            --latest
